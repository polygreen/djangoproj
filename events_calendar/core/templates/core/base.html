<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>{% block title %}Events Calendar{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
        nav a { margin-right: .75rem; }
        .card { border: 1px solid #ddd; padding: 1rem; border-radius: .5rem; max-width: 560px; }
        button { padding: .5rem .9rem; border: 1px solid #333; background: #fafafa; cursor: pointer;
        border-radius: .375rem; }
        button:hover { background: #eee; }
        .calendar-container { max-width: 900px; margin: 0 auto; }
        .calendar-table { width:100%; border-collapse:collapse; font-size:0.95rem; }
        .calendar-table th, .calendar-table td { border:1px solid #ddd; padding:0.5rem; vertical-align:top; height:80px; }
        .day-number { font-weight:bold; margin-bottom:0.3rem; }
        .empty { background:#f9f9f9; }
        .event-list { margin:0; padding:0; list-style:none; font-size:0.85rem; }
        .event-list li { background:#e3f2fd; margin:0.15rem 0; padding:0.2rem 0.4rem; border-radius:3px; }
        .btn { margin-right:0.5rem; text-decoration:none; color:#007bff; font-weight:500; }
        .today {
            background-color: #fff3cd !important;
            border: 2px solid #ffc107;
        }
        .add-event-form input, .add-event-form button {
            font-size: 0.95rem;
        }
        .event-actions a {
            font-size: 0.8rem;
            margin-right: 0.5rem;
            text-decoration: none;
        }
        .btn-small {
            background: #007bff; color: white; padding: 0.2rem 0.5rem; border-radius: 3px; font-size: 0.75rem;
        }
        .btn-small.delete {
            background: #dc3545;
        }
        .btn, .event-item, .badge {
        color: white !important;
        text-shadow: 0 1px 2px rgba(0,0,0,0.6) !important;
        }
        .btn-outline-danger {
            color: #dc3545 !important;
            border-color: #dc3545 !important;
        }
        .btn-outline-danger:hover {
            background: #dc3545 !important;
            color: white !important;
        }
        /* hover in browser */
        .event-item {
            position: relative;
            padding: 6px 8px;
            margin-bottom: 4px;
            border-radius: 4px;
            display: block;
            color: white !important;
            text-decoration: none !important;
            transition: background 0.2s;
        }

        /* Event title always visible */
        .event-item .event-link {
            display: block;
            color: inherit;
            text-decoration: none;
        }

        /* Desktop: show buttons only on hover */
        .event-item .event-actions {
            display: none;
            position: absolute;
            top: 4px;
            right: 4px;
        }
        @media (min-width: 769px) {   /* Desktop only */
            .event-item:hover {
                background: rgba(0,0,0,0.25) !important;
            }
            .event-item:hover .event-actions {
                display: block;
            }
        }

        /* Mobile: hide buttons completely */
        @media (max-width: 768px) {
            .event-item .event-actions {
                display: none !important;
            }
        }
        /* Mobile: whole event is clickable */
        @media (max-width: 768px) {
            .event-item {
                padding: 6px 8px !important;
            }
            .event-item .event-actions {
                display: none !important;   /* hide buttons on phone */
            }
            .event-link {
                display: block;
                color: inherit;
                text-decoration: none;
            }
        }
        .btn-primary,
        .btn-success,
        .btn-danger,
        .btn-warning,
        .btn-info,
        .btn-dark,
        .btn,
        .event-item,
        .badge,
        .card-header {
            color: white !important;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5) !important;
        }

        .btn-outline-primary,
        .btn-outline-secondary,
        .btn-outline-success,
        .btn-outline-danger,
        .btn-outline-warning,
        .btn-outline-info {
            color: inherit !important;
            text-shadow: none !important;
        }

        .btn-outline-primary:hover,
        .btn-outline-secondary:hover,
        .btn-outline-success:hover,
        .btn-outline-danger:hover,
        .btn-outline-warning:hover,
        .btn-outline-info:hover {
            color: white !important;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5) !important;
        }

        .btn-outline-primary,
        .btn-outline-secondary {
            color: #007bff !important;
            border-color: #007bff !important;
        }
        .btn-outline-primary:hover,
        .btn-outline-secondary:hover {
            background-color: #007bff !important;
            color: white !important;
        }
        .btn {
            color: #0d6efd !important;           /* Bright blue */
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 rounded">
        <div class="container py-4">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">Calendar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'calendar' %}">Calendar</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'event_list' %}">All Events</a></li>
                </ul>

                <!-- Right side: Authentication -->
                <ul class="navbar-nav">
                    {% if user.is_authenticated %}
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                                Hi, <strong>{{ user.username }}</strong>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="{% url 'profile' %}">Profile</a></li>
                                <li><a class="dropdown-item" href="{% url 'category_list' %}">Categories</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item text-danger" href="{% url 'logout' %}">Logout</a></li>
                            </ul>
                        </li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Login</a></li>
                        <li class="nav-item"><a class="nav-link btn btn-primary text-white px-3 ms-2" href="{% url 'signup' %}">Sign Up</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
    <hr />
    {% block content %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
