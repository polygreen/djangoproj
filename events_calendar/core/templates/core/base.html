<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>{% block title %}Counter App{% endblock %}</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
nav a { margin-right: .75rem; }
.card { border: 1px solid #ddd; padding: 1rem; border-radius: .5rem; max-width: 560px; }
button { padding: .5rem .9rem; border: 1px solid #333; background: #fafafa; cursor: pointer;
border-radius: .375rem; }
button:hover { background: #eee; }
.calendar-container { max-width: 900px; margin: 0 auto; }
.calendar-table { width:100%; border-collapse:collapse; font-size:0.95rem; }
.calendar-table th, .calendar-table td { border:1px solid #ddd; padding:0.5rem; vertical-align:top; height:80px; }
.day-number { font-weight:bold; margin-bottom:0.3rem; }
.empty { background:#f9f9f9; }
.event-list { margin:0; padding:0; list-style:none; font-size:0.85rem; }
.event-list li { background:#e3f2fd; margin:0.15rem 0; padding:0.2rem 0.4rem; border-radius:3px; }
.btn { margin-right:0.5rem; text-decoration:none; color:#007bff; font-weight:500; }
.today {
    background-color: #fff3cd !important;
    border: 2px solid #ffc107;
}
.add-event-form input, .add-event-form button {
    font-size: 0.95rem;
}
.event-actions a {
    font-size: 0.8rem;
    margin-right: 0.5rem;
    text-decoration: none;
}
.btn-small {
    background: #007bff; color: white; padding: 0.2rem 0.5rem; border-radius: 3px; font-size: 0.75rem;
}
.btn-small.delete {
    background: #dc3545;
}
</style>
</head>
<body>
<nav>
<a href="{% url 'home' %}">Home</a>
<a href="{% url 'about' %}">About</a>
</nav>
<hr />
{% block content %}{% endblock %}
</body>
</html>
