{% extends "core/base.html" %}
{% load dict_extras %}

{% block title %}Edit Event{% endblock %}

{% block content %}
<div class="container" style="max-width:600px; margin:2rem auto;">
    <h1>Edit Event</h1>
    <form method="post">
        {% csrf_token %}
        <p>
            <label>Title:</label><br>
            <input type="text" name="title" value="{{ event.title }}" required style="width:100%; padding:0.5rem; font-size:1rem;">
        </p>
        <p>
            <label>Date & Time:</label><br>
            <input type="datetime-local" name="start_date" value="{{ event.start_date|date:'Y-m-d\TH:i' }}" required style="width:100%; padding:0.5rem; font-size:1rem;">
        </p>
        <p>
            <label>Description (optional):</label><br>
            <textarea name="description" rows="3" style="width:100%; padding:0.5rem; font-size:1rem;">{{ event.description }}</textarea>
        </p>
        <button type="submit" style="background:#28a745; color:white; padding:0.75rem 1.5rem; border:none; border-radius:4px; cursor:pointer;">Save Changes</button>
        <a href="{% url 'calendar_month' event.start_date.year event.start_date.month %}" style="margin-left:1rem; color:#6c757d;">Cancel</a>
    </form>
</div>
{% endblock %}
