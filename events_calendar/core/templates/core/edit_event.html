{% extends "core/base.html" %}
{% load dict_extras %}

{% block title %}Edit Event{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h5 class="card-title">Edit Event</h5>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" name="title" value="{{ event.title }}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Date & Time</label>
                <input type="datetime-local" name="start_date" 
                       value="{{ event.start_date|date:'Y-m-d\TH:i' }}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Repeat</label>
                <select name="repeat" class="form-select">
                    <option value="none" {% if event.repeat == 'none' %}selected{% endif %}>No repeat</option>
                    <option value="yearly" {% if event.repeat == 'yearly' %}selected{% endif %}>Every year (birthday)</option>
                    <option value="monthly" {% if event.repeat == 'monthly' %}selected{% endif %}>Every month</option>
                    <option value="weekly" {% if event.repeat == 'weekly' %}selected{% endif %}>Every week</option>
                </select>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" name="is_birthday" class="form-check-input" {% if event.is_birthday %}checked{% endif %}>
                <label class="form-check-label">Birthday 🎂</label>
            </div>
            <button type="submit" class="btn btn-success">Save</button>
            <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
