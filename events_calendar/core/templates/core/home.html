{% extends "core/base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<div class="card">

<h1>Home</h1>
<p>Click if you like my calendar!</p>
<p><strong>Current count:</strong> {{ count }}</p>
<!-- This form triggers a POST to increment the count server-side -->
<form method="post" action="{% url 'increment' %}">
{% csrf_token %}
<button type="submit">Increment</button>
</form>
<p style="margin-top: .75rem; color: #666; font-size: 0.95rem;">

</p>
</div>
{% endblock %}
